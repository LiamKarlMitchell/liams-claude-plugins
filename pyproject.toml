[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "liams-claude-plugins"
version = "0.1.0"
description = "A minimal marketplace for Claude Code plugins"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Liam Karl Mitchell" }]

[project.scripts]
liams-claude-plugins = "liams_claude_plugins.cli:main"

[tool.setuptools]
packages = ["liams_claude_plugins"]
